<!doctype html>
<html lang="{{ 'hi' if lang == 'hi' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.app_name }} - {{ t.tagline }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="{{ url_for('index', lang=lang) }}">
        <span class="logo" aria-hidden="true">🌱</span>
        <span><strong>{{ t.app_name }}</strong><small>{{ t.tagline }}</small></span>
      </a>
      <nav>
        <a href="{{ url_for('index', lang=lang) }}" class="{{ 'on' if request.endpoint == 'index' }}">{{ t.nav_advisor }}</a>
        <a href="{{ url_for('insights', lang=lang) }}" class="{{ 'on' if request.endpoint == 'insights' }}">{{ t.nav_insights }}</a>
        <a class="lang" href="{{ request.path }}?lang={{ 'en' if lang == 'hi' else 'hi' }}">{{ t.language }}</a>
      </nav>
    </div>
  </header>



  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap foot">
    <span class="sdg">{{ t.sdg }}</span>
    <span>{{ t.disclaimer }}</span>
  </footer>
</body>
</html>
